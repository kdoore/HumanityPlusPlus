
<style>
  * { box-sizing: border-box; }
  .st-btn {
    padding: 6px 14px; border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md); background: var(--color-background-primary);
    color: var(--color-text-secondary); font-size: 13px; cursor: pointer; transition: all .2s;
  }
  .st-btn.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); font-weight: 500; }
  .st-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.55; min-height: 56px; transition: opacity .3s; }
</style>

<h2 class="sr-only">Interactive diagram of human information flow as a living system, with four states: awake, dreaming, contemplative, and stress</h2>

<div style="display:flex; gap:8px; margin:1rem 0 .75rem; flex-wrap:wrap;">
  <button class="st-btn active" onclick="setState('awake',this)">Awake</button>
  <button class="st-btn" onclick="setState('dream',this)">Dreaming</button>
  <button class="st-btn" onclick="setState('contemplative',this)">Contemplative</button>
  <button class="st-btn" onclick="setState('stress',this)">Stress</button>
</div>

<p class="st-desc" id="desc"></p>

<svg width="100%" viewBox="0 0 680 470" id="svg" role="img">
  <title>Human living-system information flow</title>
  <desc>Oscillatory signal from world and body flows through subconscious models, which produce both direct actions and feelings; feelings reach conscious models, which produce decisions, actions, and deliberate thoughts that loop back to update the subconscious.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- WORLD / BODY -->
  <g class="c-green">
    <rect x="24" y="180" width="104" height="60" rx="10" stroke-width="0.5"/>
    <text class="th" x="76" y="202" text-anchor="middle" dominant-baseline="central">World</text>
    <text class="th" x="76" y="220" text-anchor="middle" dominant-baseline="central">+ body</text>
  </g>
  <text class="ts" x="76" y="256" text-anchor="middle">oscillatory · 1/f</text>

  <!-- SUBCONSCIOUS -->
  <g class="c-teal">
    <rect x="170" y="150" width="160" height="120" rx="12" stroke-width="0.5"/>
    <text class="th" x="250" y="176" text-anchor="middle" dominant-baseline="central">Subconscious</text>
    <text class="ts" x="250" y="194" text-anchor="middle" dominant-baseline="central">models, parallel, in flux</text>
    <text class="ts" x="190" y="224" dominant-baseline="central">♠ gyroscope</text>
    <text class="ts" x="190" y="246" dominant-baseline="central">♦ radar</text>
  </g>

  <!-- FEELINGS / UNBIDDEN THOUGHTS -->
  <g class="c-purple" id="feel-node">
    <rect x="372" y="150" width="160" height="60" rx="10" stroke-width="0.5"/>
    <text class="th" x="452" y="172" text-anchor="middle" dominant-baseline="central">Feelings</text>
    <text class="ts" x="452" y="190" text-anchor="middle" dominant-baseline="central">unbidden thoughts</text>
  </g>

  <!-- CONSCIOUS -->
  <g class="c-blue">
    <rect x="372" y="248" width="160" height="86" rx="12" stroke-width="0.5"/>
    <text class="th" x="452" y="270" text-anchor="middle" dominant-baseline="central">Conscious</text>
    <text class="ts" x="452" y="288" text-anchor="middle" dominant-baseline="central">deliberation</text>
    <text class="ts" x="392" y="312" dominant-baseline="central">♥ compass · ♣ integration</text>
  </g>

  <!-- DIRECT ACTIONS (from subconscious) -->
  <g class="c-gray" id="direct-node">
    <rect x="170" y="360" width="160" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="250" y="378" text-anchor="middle" dominant-baseline="central">Direct actions</text>
    <text class="ts" x="250" y="394" text-anchor="middle" dominant-baseline="central">no deliberation</text>
  </g>

  <!-- DECISIONS / ACTIONS (from conscious) -->
  <g class="c-gray" id="decision-node">
    <rect x="554" y="248" width="104" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="606" y="266" text-anchor="middle" dominant-baseline="central">Decisions</text>
    <text class="ts" x="606" y="282" text-anchor="middle" dominant-baseline="central">+ actions</text>
  </g>

  <!-- DELIBERATE THOUGHTS -->
  <g class="c-gray" id="delib-node">
    <rect x="372" y="372" width="160" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="452" y="394" text-anchor="middle" dominant-baseline="central">Deliberate thoughts</text>
  </g>

  <!-- ARROWS -->
  <!-- world -> subconscious -->
  <line x1="128" y1="210" x2="168" y2="210" stroke="var(--color-text-secondary)" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <!-- subconscious -> feelings -->
  <line x1="330" y1="180" x2="370" y2="180" stroke="var(--color-text-secondary)" stroke-width="1.5" marker-end="url(#a)" fill="none" id="arr-sub-feel"/>
  <!-- subconscious -> direct actions -->
  <line x1="250" y1="270" x2="250" y2="358" stroke="var(--color-text-secondary)" stroke-width="1.5" marker-end="url(#a)" fill="none" id="arr-sub-direct"/>
  <!-- feelings -> conscious -->
  <line x1="452" y1="210" x2="452" y2="246" stroke="var(--color-text-secondary)" stroke-width="1.5" marker-end="url(#a)" fill="none" id="arr-feel-con"/>
  <!-- conscious -> decisions -->
  <line x1="532" y1="270" x2="552" y2="270" stroke="var(--color-text-secondary)" stroke-width="1.5" marker-end="url(#a)" fill="none" id="arr-con-dec"/>
  <!-- conscious -> deliberate thoughts -->
  <line x1="452" y1="334" x2="452" y2="370" stroke="var(--color-text-secondary)" stroke-width="1.5" marker-end="url(#a)" fill="none" id="arr-con-delib"/>
  <!-- deliberate thoughts -> subconscious (update loop) -->
  <path id="arr-update" d="M372 394 Q250 420 250 272" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)" fill="none"/>
  <text class="ts" id="lbl-update" x="300" y="418" text-anchor="middle">metabolize · update</text>

  <!-- DREAM motor block marker -->
  <line id="block-direct" x1="250" y1="270" x2="250" y2="358" stroke="#E24B4A" stroke-width="2.5" display="none" fill="none"/>
  <text id="block-lbl" class="ts" x="276" y="320" fill="#E24B4A" display="none">motor blocked</text>

  <!-- STRESS markers -->
  <text id="stress-lbl" class="ts" x="452" y="328" text-anchor="middle" fill="#E24B4A" display="none">♥ ♣ narrowed</text>
</svg>

<script>
const S = {
  awake: {
    desc: "All instruments online. Oscillatory signal from world and body runs through subconscious models, which produce two outputs at once: direct actions (no deliberation) and feelings or unbidden thoughts. Feelings rise to conscious deliberation, which produces decisions, actions, and deliberate thoughts — and those thoughts loop back to update the models below.",
    feel: 1, conscious: 1, direct: 1, update: 1, block: false, stress: false
  },
  dream: {
    desc: "The subconscious keeps running — replaying, consolidating, reorganizing models — but motor output is actively blocked (REM atonia, T1). Feelings and unbidden thoughts surface vividly with no action attached. This is metabolizing time: signal that was filtered out during the day is allowed to surface and dissolve. The update loop runs strongly.",
    feel: 1, conscious: 0.5, direct: 0.2, update: 1, block: true, stress: false
  },
  contemplative: {
    desc: "Walking, silent meditation, talking with a stranger. Direct reactive action is set down on purpose. Feelings and unbidden thoughts are given space to surface and be sensed without being acted on — then allowed to dissolve. Sitting with difficulty instead of blocking it. This is waking metabolizing: it returns the energy that suppression was spending.",
    feel: 1, conscious: 1, direct: 0.25, update: 1, block: false, stress: false
  },
  stress: {
    desc: "The gyroscope floods with threat. The pathway narrows: the relational compass (♥) goes offline first, dimensional integration (♣) collapses toward now (T1: polyvagal theory, trauma research). Subconscious models drive direct reactive action; conscious deliberation and the model-update loop slow or stop. Nothing is metabolized — it stays blocked, costing energy.",
    feel: 0.4, conscious: 0.35, direct: 1, update: 0.15, block: false, stress: true
  }
};

function setState(k, btn) {
  document.querySelectorAll('.st-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const s = S[k];
  document.getElementById('desc').textContent = s.desc;

  document.getElementById('feel-node').style.opacity = s.feel;
  document.getElementById('arr-sub-feel').setAttribute('stroke-opacity', s.feel);
  document.getElementById('arr-feel-con').setAttribute('stroke-opacity', s.conscious);
  document.getElementById('arr-con-dec').setAttribute('stroke-opacity', s.conscious);
  document.getElementById('arr-con-delib').setAttribute('stroke-opacity', s.conscious);
  document.getElementById('decision-node').style.opacity = Math.max(s.conscious, 0.25);
  document.getElementById('delib-node').style.opacity = Math.max(s.conscious, 0.25);

  document.getElementById('arr-sub-direct').setAttribute('stroke-opacity', s.direct);
  document.getElementById('direct-node').style.opacity = Math.max(s.direct, 0.25);

  document.getElementById('arr-update').setAttribute('stroke-opacity', s.update);
  document.getElementById('lbl-update').setAttribute('opacity', s.update);

  document.getElementById('block-direct').setAttribute('display', s.block ? 'inline' : 'none');
  document.getElementById('block-lbl').setAttribute('display', s.block ? 'inline' : 'none');
  document.getElementById('stress-lbl').setAttribute('display', s.stress ? 'inline' : 'none');
}
setState('awake', document.querySelector('.st-btn'));
</script>
